[project]
name = "intent-core-api"
version = "0.1.0"
description = "FastAPI modular-monolith backend for the Intent Core Alignment System."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "arq>=0.26",
  "intent-core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_core_api"]

[tool.uv.sources]
intent-core-contracts = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7.4",
  "mypy>=1.13",
]
