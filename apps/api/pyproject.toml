[project]
name = "intent-core-api"
version = "0.1.0"
description = "FastAPI modular-monolith backend for the Intent Core Alignment System."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "arq>=0.26",
  # ADR-0013: the alignment_assessment Anthropic provider was replaced
  # with DeepSeek before anything was committed (real-account billing
  # could not be completed). DeepSeekAlignmentAssessmentGenerator uses
  # DeepSeek's OpenAI-compatible endpoint via the official `openai`
  # package -- >=1.0 is the first release of the current client shape
  # (OpenAI(api_key=..., base_url=...), response_format={"type":
  # "json_object"}), which has been stable since the SDK's 2023 rewrite.
  "openai>=1.0",
  "intent-core-contracts",
  # Step 9B-4: the smallest, existing, sanctioned path to a real ftrack
  # read (docs/step-9/02_STEP_9A_...md §9/§11's own recommendation) --
  # apps/api never talks to ftrack directly except through this
  # Connector, matching services/worker's identical existing dependency
  # on the same package (CLAUDE.md: "All external production data must
  # pass through the Connector"). This one read-only capability is
  # resolved transiently, per request, and never persisted.
  "intent-core-connector",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_core_api"]

[tool.uv.sources]
intent-core-contracts = { workspace = true }
intent-core-connector = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7.4",
  "mypy>=1.13",
]
