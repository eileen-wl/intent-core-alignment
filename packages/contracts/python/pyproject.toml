[project]
name = "intent-core-contracts"
version = "0.1.0"
description = "Canonical shared Pydantic contracts: API request/response schemas, internal event payloads, and the Agent output envelope."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_core_contracts"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7.4",
  "mypy>=1.13",
  "hatchling>=1.25",
]
