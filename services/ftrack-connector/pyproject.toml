[project]
name = "intent-core-connector"
version = "0.1.0"
description = "ftrack Workflow Connector: sync, events, mapping, and authorised write-back."
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.5",
  "ftrack-python-api>=3.1",
  "requests>=2.31",
  "httpx>=0.27",
  "intent-core-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_core_connector"]

[tool.uv.sources]
intent-core-contracts = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7.4",
  "mypy>=1.13",
  "hatchling>=1.25",
]
