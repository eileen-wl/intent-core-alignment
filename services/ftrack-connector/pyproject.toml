[project]
name = "intent-core-connector"
version = "0.1.0"
description = "ftrack Workflow Connector: sync, events, mapping, and authorised write-back."
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_core_connector"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7.4",
  "mypy>=1.13",
]
